<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Breitling">
  <defs>
    <linearGradient id="breitling-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C9A6"/>
      <stop offset="50%" stop-color="#D9B08D"/>
      <stop offset="100%" stop-color="#B8935F"/>
    </linearGradient>
    <style>
      .wm { font-family: 'Playfair Display', 'Didot', 'Times New Roman', serif; font-weight: 500; letter-spacing: 0.3em; }
      .tg { font-family: 'Cormorant Garamond', 'Garamond', serif; font-style: italic; letter-spacing: 0.3em; }
    </style>
  </defs>
  <rect width="400" height="400" fill="#2C3531"/>
  <rect x="30" y="30" width="340" height="340" fill="none" stroke="#D9B08D" stroke-width="0.5" opacity="0.3"/>

  <!-- Winged anchor-like aviation symbol -->
  <g transform="translate(200, 155)" fill="url(#breitling-gold)" stroke="url(#breitling-gold)" stroke-width="1">
    <!-- Wings -->
    <path d="M -55,0 Q -40,-8 -20,-5 L -20,5 Q -40,8 -55,0 Z"/>
    <path d="M 55,0 Q 40,-8 20,-5 L 20,5 Q 40,8 55,0 Z"/>
    <!-- Center letter B -->
    <text x="0" y="12" font-family="Georgia, serif" font-size="38" fill="url(#breitling-gold)" text-anchor="middle" font-weight="500" stroke="none">B</text>
    <!-- Small anchor at bottom -->
    <path d="M 0,20 L 0,35 M -8,30 Q 0,38 8,30" fill="none" stroke-width="1.5"/>
  </g>

  <text x="200" y="250" class="wm" fill="url(#breitling-gold)" font-size="26" text-anchor="middle">BREITLING</text>
  <line x1="140" y1="270" x2="195" y2="270" stroke="#D9B08D" stroke-width="0.6"/>
  <circle cx="200" cy="270" r="1.5" fill="#D9B08D"/>
  <line x1="205" y1="270" x2="260" y2="270" stroke="#D9B08D" stroke-width="0.6"/>
  <text x="200" y="300" class="tg" fill="#D1E8E2" font-size="12" text-anchor="middle" opacity="0.8">GRENCHEN · 1884</text>
</svg>
