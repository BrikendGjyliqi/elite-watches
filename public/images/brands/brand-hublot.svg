<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Hublot">
  <defs>
    <linearGradient id="hublot-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C9A6"/>
      <stop offset="50%" stop-color="#D9B08D"/>
      <stop offset="100%" stop-color="#B8935F"/>
    </linearGradient>
    <style>
      .wm { font-family: 'Playfair Display', 'Didot', 'Times New Roman', serif; font-weight: 500; letter-spacing: 0.35em; }
      .tg { font-family: 'Cormorant Garamond', 'Garamond', serif; font-style: italic; letter-spacing: 0.3em; }
    </style>
  </defs>
  <rect width="400" height="400" fill="#2C3531"/>
  <rect x="30" y="30" width="340" height="340" fill="none" stroke="#D9B08D" stroke-width="0.5" opacity="0.3"/>

  <!-- Porthole motif (hublot = porthole in French) -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="url(#hublot-gold)" stroke-width="2"/>
    <!-- 6 screws around the porthole -->
    <circle cx="0" cy="-45" r="3.5" fill="url(#hublot-gold)"/>
    <circle cx="39" cy="-22" r="3.5" fill="url(#hublot-gold)"/>
    <circle cx="39" cy="22" r="3.5" fill="url(#hublot-gold)"/>
    <circle cx="0" cy="45" r="3.5" fill="url(#hublot-gold)"/>
    <circle cx="-39" cy="22" r="3.5" fill="url(#hublot-gold)"/>
    <circle cx="-39" cy="-22" r="3.5" fill="url(#hublot-gold)"/>
    <!-- Center H -->
    <text x="0" y="12" font-family="Georgia, serif" font-size="38" fill="url(#hublot-gold)" text-anchor="middle" font-weight="500">H</text>
  </g>

  <text x="200" y="250" class="wm" fill="url(#hublot-gold)" font-size="28" text-anchor="middle">HUBLOT</text>
  <line x1="140" y1="270" x2="195" y2="270" stroke="#D9B08D" stroke-width="0.6"/>
  <circle cx="200" cy="270" r="1.5" fill="#D9B08D"/>
  <line x1="205" y1="270" x2="260" y2="270" stroke="#D9B08D" stroke-width="0.6"/>
  <text x="200" y="300" class="tg" fill="#D1E8E2" font-size="12" text-anchor="middle" opacity="0.8">NYON · 1980</text>
</svg>
