<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="ÉLITE — Maison Horlogère" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C9A6"/>
      <stop offset="50%" stop-color="#D9B08D"/>
      <stop offset="100%" stop-color="#B8935F"/>
    </linearGradient>
    <style>
      .wordmark {
        font-family: 'Playfair Display', 'Didot', 'Bodoni 72', 'Bodoni MT', 'Times New Roman', serif;
        font-weight: 500;
        letter-spacing: 0.42em;
      }
      .tagline {
        font-family: 'Cormorant Garamond', 'Garamond', 'EB Garamond', 'Times New Roman', serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: 0.28em;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#2C3531"/>

  <!-- Outer decorative hairline frame -->
  <rect x="60" y="60" width="680" height="280" fill="none" stroke="#D9B08D" stroke-width="0.6" opacity="0.35"/>

  <!-- ÉLITE Wordmark -->
  <text x="400" y="205" class="wordmark" fill="url(#goldGrad)" font-size="96" text-anchor="middle">
    ÉLITE
  </text>

  <!-- Hairline divider with center ornament -->
  <line x1="230" y1="240" x2="380" y2="240" stroke="#D9B08D" stroke-width="0.8"/>
  <circle cx="400" cy="240" r="2.5" fill="#D9B08D"/>
  <line x1="420" y1="240" x2="570" y2="240" stroke="#D9B08D" stroke-width="0.8"/>

  <!-- Tagline -->
  <text x="400" y="278" class="tagline" fill="#D1E8E2" font-size="18" text-anchor="middle" opacity="0.85">
    MAISON HORLOGÈRE
  </text>

  <!-- Est. line -->
  <text x="400" y="308" class="tagline" fill="#D9B08D" font-size="11" text-anchor="middle" opacity="0.6" letter-spacing="0.5em">
    EST. MMXXVI · PRISHTINA
  </text>
</svg>
